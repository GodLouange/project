security:
    # Hachage automatique des mots de passe (algorithme le plus sûr disponible)
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Les utilisateurs sont chargés depuis la base, par leur e-mail
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    # Hiérarchie des rôles : le SUPER_ADMIN a tous les droits de l'ADMIN, qui a tous ceux du USER
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    firewalls:
        dev:
            # Outils de développement et assets toujours accessibles
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Connexion par formulaire (SecurityController::connexion)
            form_login:
                login_path: app_connexion
                check_path: app_connexion
                enable_csrf: true
                default_target_path: app_accueil

            # Déconnexion
            logout:
                path: app_deconnexion
                target: app_accueil

    # Contrôle d'accès par URL (seule la PREMIÈRE règle qui correspond est appliquée)
    access_control:
        - { path: ^/super-admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/panier, roles: ROLE_USER }
        - { path: ^/compte, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hachage volontairement faible en test pour accélérer les tests
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
